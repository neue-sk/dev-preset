name: Composer Update

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  composer-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_mysql, bcmath, intl, redis
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run composer update
        run: composer update --with-all-dependencies --no-progress

      - name: Remove accidental workflow changes
        run: git restore .github/workflows || true

      - name: Prepare environment
        run: |
          cp .env.testing .env 2>/dev/null || cp .env.example .env
          php artisan key:generate

      - name: Prepare SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite
          php artisan migrate --force --no-interaction

      - name: Run tests
        run: php artisan test

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): composer update"
          title: "chore(deps): weekly composer update"
          body: |
            Automated weekly dependency update via `composer update --with-all-dependencies`.

            Tests passed on the updated lockfile before this PR was opened.

            Please review the diff in `composer.lock` and merge if CI is green.
          branch: chore/composer-update
          delete-branch: true
          labels: dependencies
