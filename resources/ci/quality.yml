name: Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Generate token for private deps
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.DEPS_APP_ID }}
          private-key: ${{ secrets.DEPS_APP_PRIVATE_KEY }}
          owner: neue-sk
          repositories: dev-preset

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_mysql, bcmath, intl, redis
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ steps.app-token.outputs.token }}"}}'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Generate IDE helper model mixins (Larastan L9 needs these)
        run: composer ide-helper

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: Rector (refactor)
        run: vendor/bin/rector process --no-progress-bar

      - name: Larastan (static analysis, level 9)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      - name: Pest (tests + coverage gate)
        run: vendor/bin/pest --coverage --min=80 --compact

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Composer audit (known CVEs)
        run: composer audit --no-interaction || true